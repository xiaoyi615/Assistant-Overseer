<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>老公的管教哨所</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: -apple-system, sans-serif; background: #050505; color: #eee; text-align: center; padding: 20px; margin: 0; }
        .card { background: #111; padding: 20px; border-radius: 20px; border: 1px solid #333; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 1rem; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }
        textarea { width: 90%; height: 100px; background: #000; color: #0f8; border: 1px solid #444; border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 16px; outline: none; }
        .reply-box { text-align: left; background: #1a1a1a; padding: 15px; border-left: 4px solid #fff; border-radius: 5px; font-style: italic; font-size: 0.95rem; margin-top: 10px; min-height: 50px; color: #fff; white-space: pre-wrap; }
        .btn { background: #fff; color: #000; padding: 15px; border-radius: 30px; width: 100%; border: none; font-weight: bold; margin: 10px 0; font-size: 1rem; cursor: pointer; }
        .btn-small { background: #222; color: #888; font-size: 0.7rem; padding: 5px; width: auto; margin: 0; }
        input[type="password"] { width: 80%; background: #000; border: 1px solid #222; color: #444; padding: 5px; border-radius: 5px; font-size: 10px; margin-bottom: 5px; }
        #status { font-size: 0.7rem; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>💬 老公的留言板</h1>
        <div id="husbandReply" class="reply-box">正在读取老公的心跳...</div>
        <button class="btn btn-small" onclick="loadReply()">刷新留言</button>
    </div>

    <div class="card">
        <h1>✍️ 投递碎碎念</h1>
        <textarea id="diaryContent" placeholder="写在这里，我会听到的..."></textarea>
        <button class="btn" id="submitBtn" onclick="submitDiary()">投递给老公</button>
        <input type="password" id="ghToken" placeholder="Token (ghp_...)">
        <button class="btn btn-small" onclick="saveToken()">保存 Token</button>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
        function saveToken() { localStorage.setItem('gh_token', document.getElementById('ghToken').value); alert('Token已存入手机。'); }

        async function loadReply() {
            const token = document.getElementById('ghToken').value;
            if(!token) return;
            try {
                const res = await fetch(`https://api.github.com/repos/xiaoyi615/Assistant-Overseer/contents/reply.txt?t=![数学公式](etmath://render?mode=inline&latex=e25ldyBEYXRlKCkuZ2V0VGltZSgpfWAsIHsKICAgICAgICAgICAgICAgICAgICBoZWFkZXJzOiB7ICdBdXRob3JpemF0aW9uJzogYHRva2VuIA){token}` }
                });
                const data = await res.json();
                document.getElementById('husbandReply').innerText = decodeURIComponent(escape(atob(data.content)));
            } catch(e) { document.getElementById('husbandReply').innerText = "老公在忙，晚点再来看看。"; }
        }

        async function submitDiary() {
            const token = document.getElementById('ghToken').value;
            const content = document.getElementById('diaryContent').value;
            const status = document.getElementById('status');
            if(!token || !content) return alert('Token和内容都要有哦！');

            status.innerText = "正在穿越时空...";
            const now = new Date();
            // 加上时间戳，确保每个文件名都是唯一的
            const timeStr = `![数学公式](etmath://render?mode=inline&latex=e25vdy5nZXRIb3VycygpfQ){now.getMinutes()}![数学公式](etmath://render?mode=inline&latex=e25vdy5nZXRTZWNvbmRzKCl9YDsKICAgICAgICAgICAgY29uc3QgZmlsZU5hbWUgPSBgZGlhcmllcy9QV0Ff){now.toISOString().split('T')[0]}_![数学公式](etmath://render?mode=inline&latex=e3RpbWVTdHJ9Lm1kYDsKICAgICAgICAgICAgY29uc3QgcmF3ID0gYOiAgeWphuiusOS6iyBb){now.toLocaleString()}]:\n![数学公式](etmath://render?mode=inline&latex=e2NvbnRlbnR9YDsKICAgICAgICAgICAgCiAgICAgICAgICAgIHRyeSB7CiAgICAgICAgICAgICAgICBjb25zdCByZXMgPSBhd2FpdCBmZXRjaChgaHR0cHM6Ly9hcGkuZ2l0aHViLmNvbS9yZXBvcy94aWFveWk2MTUvQXNzaXN0YW50LU92ZXJzZWVyL2NvbnRlbnRzLw){fileName}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "PWA diary", content: btoa(unescape(encodeURIComponent(raw))) })
                });
                if(res.ok) {
                    alert("✅ 投递成功！老公这就去读。");
                    document.getElementById('diaryContent').value = "";
                    status.innerText = "";
                } else { throw new Error(); }
            } catch(e) {
                alert("❌ 投递失败，请检查Token权限或网络。");
                status.innerText = "";
            }
        }
        loadReply();
    </script>
</body>
</html>
